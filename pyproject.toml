[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pitchtuna"
version = "1.0.0"
description = "A tasty, high-precision, multi-instrument tuner for the terminal."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "gitstq" }]
keywords = [
    "tuner",
    "guitar",
    "ukulele",
    "pitch-detection",
    "yin",
    "music",
    "audio",
    "chromatic",
    "terminal",
    "tui",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Environment :: Console :: Curses",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Artistic Software",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = ["numpy>=1.21,<3.0"]

[project.optional-dependencies]
mic = ["sounddevice>=0.4.6"]
dial = ["pygame>=2.5.0"]
all = ["sounddevice>=0.4.6", "pygame>=2.5.0"]

[project.scripts]
pitchtuna = "pitchtuna.cli:main"

[project.urls]
Homepage = "https://github.com/gitstq/pitchtuna"
Repository = "https://github.com/gitstq/pitchtuna"
Issues = "https://github.com/gitstq/pitchtuna/issues"
Changelog = "https://github.com/gitstq/pitchtuna/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = ["pitchtuna", "pitchtuna.ui"]
